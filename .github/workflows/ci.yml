name: CI

on:
  push:
    branches:
      - dev
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/pathways_phase4_phase6_replay?sslmode=disable
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/pathways_phase4_phase6_replay?sslmode=disable
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      ENABLE_SWAGGER: 'false'
      API_PORT: '4000'
      API_PREFIX: api
      WEB_PORT: '3000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL 18 for disposable local replay
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          source /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-18

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma baseline
        run: |
          pnpm --filter @pathways/api exec prisma validate --schema prisma/schema.prisma
          pnpm --filter @pathways/api exec prisma generate --schema prisma/schema.prisma

      - name: Replay verified history, baseline and forward corrections
        shell: pwsh
        run: ./infra/supabase/phase6/Replay-Local.ps1 -MigrationBaseline -PostgresBin /usr/lib/postgresql/18/bin

      - name: Check committed files for secret assignments
        shell: bash
        run: |
          if git grep -I -q -E '(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_JWT_SECRET|DATABASE_URL|DIRECT_URL|SHADOW_DATABASE_URL)=[^[:space:]]+' -- ':!*.example' ':!*.test.ts'; then
            echo 'Potential committed secret assignment detected.'
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  sad:
    name: Automated SAD checks (specialist sign-off remains separate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test SAD checker
        run: pnpm sad:test

      - name: Typecheck SAD checker
        run: pnpm sad:typecheck

      - name: Review changed paths with automated SAD checks
        shell: bash
        env:
          SAD_EVENT: ${{ github.event_name }}
          SAD_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SAD_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SAD_PUSH_BASE: ${{ github.event.before }}
          SAD_PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$SAD_EVENT" == "pull_request" ]]; then
            base="$SAD_PR_BASE"
            head="$SAD_PR_HEAD"
          else
            base="$SAD_PUSH_BASE"
            head="$SAD_PUSH_HEAD"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git hash-object -t tree -w /dev/null)"
            fi
          fi
          mkdir -p "$RUNNER_TEMP/sad"
          pnpm sad:check -- --base "$base" --head "$head" --output "$RUNNER_TEMP/sad/evaluations.json"

      - name: Upload automated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-automated-diagnostics
          path: ${{ runner.temp }}/sad/evaluations.json
          if-no-files-found: warn
